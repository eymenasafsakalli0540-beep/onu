.act{filter:drop-shadow(0 0 10px #fde047)}

const $=s=>document.querySelector(s),CH='rygb',CN=['Kırmızı','Sarı','Yeşil','Mavi'],CC=['#e11d48','#eab308','#16a34a','#2563eb'],T4=4000,N=4;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const mkc=k=>k=='W'||k=='F'||k=='X'?{c:-1,v:k,k}:{c:CH.indexOf(k[0]),v:/^\d$/.test(k[1])?+k[1]:k[1],k};
const desc=c=>c.c<0?{W:'Joker',F:'Joker +4',X:'El Değiştirme'}[c.v]:CN[c.c]+' '+({S:'Atla',R:'Yön',D:'+2'}[c.v]??c.v);
function mk(){const a=[],add=(c,v,n)=>{for(let i=0;i<n;i++)a.push(mkc((c<0?'':CH[c])+v))};
for(let c=0;c<4;c++){add(c,0,1);for(let n=1;n<10;n++)add(c,n,2);['S','R','D'].forEach(v=>add(c,v,2))}
['W','F','X'].forEach(v=>add(-1,v,4));return sh(a)}

/* ---------- durum ---------- */
let S=null,V=null,MODE='menu',NET=null,HOST=false,HOSTPEER='',MY=0,CODE='',SEATS=[],seatPeer=[null,null,null,null],HAND=[],LASTN=0,SEQ=0,EVID=0,lastEv=0,PC={},PDL=-1,TM=[],BT,IT,RT,HI,dr,ans,MSG='',CL=[],RMP;
const RC=Array.from({length:4},()=>'abcdefghjkmnpqrstuvwxyz23456789'[Math.random()*31|0]).join('');
const nxt=(p,n=1)=>((p+S.dir*n)%N+N)%N;
const nm=s=>S.names[s];
const lg=m=>S.log.push(m);
const ev=(a,b)=>{S.ev=[++EVID,a,b||'']};
const em=(t,d)=>{try{if(NET)NET.emit(t,d).catch(()=>{})}catch(e){}};
const srt=h=>h.sort((a,b)=>(a.c<0?9:a.c)-(b.c<0?9:b.c)||String(a.v).localeCompare(String(b.v)));
const ok=c=>c.c<0||c.c==S.col||c.v===S.top.v;
const okv=c=>c.c<0||c.c==V.col||c.v===V.top.v;
function later(ms,fn){const g=S;TM.push(setTimeout(()=>{if(S===g)fn()},ms))}
function clr(){TM.forEach(clearTimeout);TM=[];clearTimeout(BT);clearTimeout(IT);clearTimeout(RT)}

/* ---------- oyun motoru (solo / host) ---------- */
function startGame(hum,names){clr();
S={dir:1,turn:0,drew:-1,dc:null,mi:[],say:[false,false,false,false],over:0,lm:-1,log:['Oyun başladı!'],h:[[],[],[],[]],deck:mk(),disc:[],hum,names,ev:[++EVID,'',''],bub:-1};
for(let i=0;i<7;i++)for(let p=0;p<N;p++)draw(p,1);
while(typeof S.deck.at(-1).v!='number')S.deck.unshift(S.deck.pop());
S.top=S.deck.pop();S.disc=[S.top];S.col=S.top.c;
V=null;lastEv=EVID;PC={};PDL=-1;MODE='game';pub();sched()}
function draw(p,n){let l=null;for(let i=0;i<n;i++){if(!S.deck.length){const t=S.disc.pop();S.deck=sh(S.disc);S.disc=[t]}if(S.deck.length){l=S.deck.pop();S.h[p].push(l)}}srt(S.h[p]);if(S.h[p].length>2)S.say[p]=false;return l}
function liveMi(){const now=Date.now();S.mi=S.mi.filter(m=>now-m.t<=T4&&S.h[m.s].length==1);return S.mi}
function viewOf(s){return{me:s,nm:S.names,hum:S.hum,cnt:S.h.map(h=>h.length),hand:S.h[s].slice(),top:S.top,col:S.col,dir:S.dir,turn:S.turn,over:S.over,dk:S.deck.length,dr:S.drew,dck:S.dc?S.dc.k:'',mi:liveMi().map(m=>({s:m.s,exp:m.t+T4})),bub:S.bub,lm:S.lm,dl:S.disc.length,dsc:S.disc.slice(-5),lg:S.log.slice(-2),ev:S.ev}}
function pub(){if(!S)return;const prev=V;V=viewOf(MY);if(NET&&HOST)bcast();afterView(prev)}
function bcast(){S.hum.forEach((h,s)=>{if(s&&h&&seatPeer[s])em('hd',{to:seatPeer[s],h:S.h[s].map(c=>c.k)})});
const v=V;em('st',{n:++SEQ,nm:v.nm,hum:v.hum,cnt:v.cnt,top:v.top.k,col:v.col,dir:v.dir,turn:v.turn,over:v.over,dk:v.dk,dr:v.dr,dck:v.dck,mi:v.mi.map(m=>[m.s,Math.max(0,m.exp-Date.now())]),bub:v.bub,lm:v.lm,dl:v.dl,dsc:v.dsc.map(c=>c.k),lg:v.lg,ev:v.ev})}
function next(){pub();sched()}
function sched(){clearTimeout(BT);clearTimeout(IT);if(!S||S.over)return;const p=S.turn,g=S;
if(!S.hum[p])BT=setTimeout(()=>{if(S===g&&!S.over&&S.turn==p&&!S.hum[p])botMove(p)},1500+Math.random()*500);
else if(NET)IT=setTimeout(()=>{if(S===g&&!S.over&&S.turn==p&&S.hum[p]){lg(nm(p)+': süre doldu');botMove(p)}},45000)}
function say(p){S.bub=p;lg(nm(p)+': UNO!');if(!S.hum[p])hostChat(p,'UNO!');later(1800,()=>{if(S.bub==p){S.bub=-1;pub()}})}
function goOne(p){if(S.say[p]){S.say[p]=false;say(p);return}
const m={s:p,t:Date.now()};S.mi.push(m);
if(!S.hum[p]){if(Math.random()<.7)later(700+Math.random()*2300,()=>{if(S.mi.includes(m)&&!S.over){S.mi=S.mi.filter(x=>x!==m);say(p);pub()}})}
else if(S.hum.includes(false))later(1800+Math.random()*1800,()=>{if(S.mi.includes(m)&&!S.over&&S.h[p].length==1){S.mi=S.mi.filter(x=>x!==m);draw(p,2);lg(nm(p)+' UNO demedi, yakalandı! +2');ev('🤖 YAKALANDIN!',nm(p)+' UNO demedi: +2 kart');pub()}});
later(T4+50,()=>pub())}
function ub(s){if(!S||S.over)return;const now=Date.now(),mine=liveMi().find(m=>m.s==s);
if(mine){S.mi=S.mi.filter(x=>x!==mine);say(s);return pub()}
const t=S.mi.find(m=>m.s!=s&&now-m.t<=T4&&S.h[m.s].length==1);
if(t){S.mi=S.mi.filter(x=>x!==t);draw(t.s,2);lg(nm(t.s)+' UNO demedi! +2 kart (şikayet)');ev('📢 ŞİKAYET!',nm(t.s)+' UNO demedi: +2 kart');return pub()}
if(S.h[s].length<=2){S.say[s]=true;say(s)}pub()}
function play(p,c,col,tg){const h=S.h[p];h.splice(h.indexOf(c),1);S.disc.push(c);S.top=c;S.drew=-1;S.dc=null;S.lm=p;
const v=c.v;let skip=0,m=nm(p)+': '+desc(c);
if(!h.length){S.over=p+1;S.mi=[];lg(m);clearTimeout(BT);clearTimeout(IT);return pub()}
S.col=c.c<0?col:c.c;if(c.c<0)m+=' → '+CN[col];
if(v=='R'){S.dir*=-1;ev('↻ YÖN DEĞİŞTİ',S.dir>0?'saat yönü':'ters yön')}
if(v=='S'){skip=1;ev('⊘ ATLA!')}
if(v=='D'){draw(nxt(p),2);skip=1;ev('+2')}
if(v=='F'){draw(nxt(p),4);skip=1;ev('+4')}
if(v=='X'){[S.h[p],S.h[tg]]=[S.h[tg],S.h[p]];m+=' ('+nm(tg)+' ile)';ev('🤝 EL DEĞİŞTİ',nm(p)+' ↔ '+nm(tg))}
if(S.h[p].length==1)goOne(p);
lg(m);S.turn=nxt(p,1+skip);next()}
function drawAct(p){const c=draw(p,1);S.drew=p;S.dc=c;lg(nm(p)+' kart çekti');pub();
if(S.hum[p]&&(!c||!ok(c)))later(900,()=>{if(S.drew==p&&S.turn==p)pass()})}
function pass(){if(S.drew<0)return;S.drew=-1;S.dc=null;S.turn=nxt(S.turn);next()}
function bestCol(p){const n=[0,0,0,0];S.h[p].forEach(c=>{if(c.c>=0)n[c.c]++});const m=Math.max(...n);return m?n.indexOf(m):Math.random()*4|0}
function bestTg(p){return S.h.map((h,i)=>[h.length,i]).filter(x=>x[1]!=p).sort((a,b)=>a[0]-b[0])[0][1]}
function pick(p){const dom=bestCol(p),tg=bestTg(p);let b=null,bs=-9;S.h[p].forEach(c=>{if(!ok(c))return;const sp=c.c>=0&&isNaN(c.v);let s=Math.random()+(c.c<0?-5:1)+(c.c==dom?1:0)+(sp?2:0)+(sp&&S.h[nxt(p)].length<3?3:0);if(c.v=='X')s+=S.h[p].length>S.h[tg].length+2?9:-3;if(s>bs){bs=s;b=c}});return b}
function botMove(p){if(S.over||S.turn!=p)return;let c=null;
if(S.drew==p)c=S.dc&&ok(S.dc)?S.dc:null;
else{c=pick(p);if(!c){drawAct(p);return later(900,()=>botMove(p))}}
if(!c)return pass();play(p,c,bestCol(p),bestTg(p))}
function doAct(s,a){if(!S||!a||typeof a!='object')return;
if(a.t=='uno')return ub(s);
if(S.over||S.turn!=s)return;
if(a.t=='draw'){if(S.drew<0)drawAct(s);return}
if(a.t=='pass'){if(S.drew==s)pass();return}
if(a.t=='play'){const c=S.h[s].find(x=>x.k===a.k&&(S.drew!=s||x===S.dc));if(!c||!ok(c))return;
const col=Number.isInteger(a.col)&&a.col>=0&&a.col<4?a.col:bestCol(s);
const tg=Number.isInteger(a.tg)&&a.tg>=0&&a.tg<4&&a.tg!=s?a.tg:bestTg(s);
play(s,c,col,tg)}}
